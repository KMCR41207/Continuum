[project]
name = "continuum-memory"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "chromadb>=1.0,<2", "mcp>=1.20,<2", "pypdf>=5,<7", "python-docx>=1.1,<2",
]
[project.optional-dependencies]
local-model = ["sentence-transformers>=4,<6"]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
