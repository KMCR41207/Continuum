<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Continuum</title>
  <style>
    body { font: 13px/1.5 sans-serif; margin: 0; padding: 12px; width: 280px; background: #10141d; color: #dae3f1; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #fff; letter-spacing: 0.04em; }
    .status { padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; background: #1a2535; border: 1px solid #2a3a55; }
    .status.ok { border-color: #2a5a2a; background: #1a2e1a; }
    .status.err { border-color: #5a2a2a; background: #2e1a1a; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .row label { font-size: 12px; color: #89909d; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1e2d40; border: 1px solid #2a3a55; }
    .pill.on { background: #1a3a1a; border-color: #2a5a2a; color: #7fba7f; }
    select { background: #1a2535; color: #dae3f1; border: 1px solid #2a3a55; border-radius: 3px; font-size: 12px; padding: 4px 6px; width: 100%; margin-bottom: 8px; }
    button { background: #2a3a55; color: #dae3f1; border: 1px solid #3a4a65; border-radius: 3px; font-size: 12px; padding: 6px 10px; cursor: pointer; width: 100%; margin-bottom: 6px; }
    button:hover { background: #3a4a65; }
    button.primary { background: #1a3a6a; border-color: #2a5a9a; }
    button.primary:hover { background: #2a4a7a; }
    .loading { color: #89909d; font-size: 12px; }
    .sep { border: none; border-top: 1px solid #1e2d40; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Continuum capture</h1>
  <div id="status-box" class="status loading">Loading…</div>

  <div class="row">
    <label>Auto capture</label>
    <span id="auto-pill" class="pill">—</span>
  </div>
  <div class="row">
    <label>Capture paused</label>
    <span id="paused-pill" class="pill">—</span>
  </div>

  <hr class="sep">

  <label style="font-size:12px;color:#89909d;display:block;margin-bottom:4px">Destination project</label>
  <select id="project-select">
    <option value="">Global (no project)</option>
  </select>

  <button class="primary" id="capture-now">⚡ Capture now</button>
  <button id="open-options">⚙ Settings</button>

  <hr class="sep">
  <div id="last-status" style="font-size:11px;color:#89909d;min-height:16px"></div>

  <script src="popup.js"></script>
</body>
</html>
